{% extends "admin/base.html" %}
{% block title %} · 장바구니{% endblock %}
{% block nav_cart %}active{% endblock %}
{% block page_title %}<i class="bi bi-cart3 me-2"></i>장바구니 관리{% endblock %}

{% block content %}
<div class="card mb-3">
  <div class="card-body py-2 d-flex gap-2 align-items-center">
    <input id="q" class="form-control form-control-sm" placeholder="이메일 또는 이름 검색" style="max-width:260px"
           onkeydown="if(event.key==='Enter') loadCarts()">
    <button class="btn btn-sm btn-primary" onclick="loadCarts()"><i class="bi bi-search me-1"></i>검색</button>
    <span class="ms-auto text-muted small" id="totalLabel"></span>
  </div>
</div>

<div class="card">
  <div class="card-body p-0">
    <div class="table-responsive">
      <table class="table table-hover align-middle mb-0">
        <thead class="table-light">
          <tr>
            <th>사용자</th><th>아이템 수</th><th>최근 업데이트</th><th>생성일</th>
            <th style="width:80px"></th>
          </tr>
        </thead>
        <tbody id="tBody">
          <tr><td colspan="5" class="text-center text-muted py-5">로딩 중...</td></tr>
        </tbody>
      </table>
    </div>
  </div>
</div>
<div id="pgWrap" class="mt-3 d-flex justify-content-center"></div>

<!-- 상세 모달 -->
<div class="modal fade" id="detailModal" tabindex="-1">
  <div class="modal-dialog modal-xl">
    <div class="modal-content">
      <div class="modal-header">
        <h6 class="modal-title fw-semibold">장바구니 상세 — <span id="dUserName" class="text-muted fw-normal"></span></h6>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body" id="detailBody">
        <div class="text-center py-4 text-muted">로딩 중...</div>
      </div>
      <div class="modal-footer py-2">
        <button class="btn btn-sm btn-secondary" data-bs-dismiss="modal">닫기</button>
      </div>
    </div>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script>
let curPage = 1;
const detailModal = new bootstrap.Modal(document.getElementById('detailModal'));

async function loadCarts(page = 1) {
  curPage = page;
  const q = encodeURIComponent(document.getElementById('q').value.trim());
  try {
    const res = await api('GET', `/admin/api/cart?page=${page}&limit=20&search=${q}`);
    document.getElementById('totalLabel').textContent = `총 ${res.pagination.total}개`;
    renderTable(res.data);
    renderPagination('pgWrap', res.pagination, 'loadCarts');
  } catch(e) { showToast(e.message, 'error'); }
}

function renderTable(carts) {
  const tb = document.getElementById('tBody');
  if (!carts.length) {
    tb.innerHTML = '<tr><td colspan="5" class="text-center text-muted py-5">데이터가 없습니다.</td></tr>';
    return;
  }
  tb.innerHTML = carts.map(c => `
    <tr>
      <td>
        <div class="fw-semibold small">${esc(c.user_name ?? '-')}</div>
        <div class="text-muted small">${esc(c.user_email ?? '-')}</div>
      </td>
      <td><span class="badge bg-secondary">${c.item_count ?? 0}개</span></td>
      <td class="text-muted small">${fmtDate(c.updated_at)}</td>
      <td class="text-muted small">${fmtDate(c.created_at)}</td>
      <td>
        <button class="btn btn-sm btn-outline-secondary py-0" onclick="openDetail('${c.id}','${esc(c.user_name ?? c.user_email ?? c.id)}')">
          <i class="bi bi-eye"></i> 상세
        </button>
      </td>
    </tr>`).join('');
}

async function openDetail(id, userName) {
  document.getElementById('dUserName').textContent = userName;
  document.getElementById('detailBody').innerHTML = '<div class="text-center py-4 text-muted">로딩 중...</div>';
  detailModal.show();
  try {
    const res  = await api('GET', `/admin/api/cart/${id}`);
    const cart = res.data;
    const items = cart.items ?? [];
    document.getElementById('detailBody').innerHTML = `
      <div class="mb-3 d-flex gap-3">
        <div><span class="text-muted small">사용자:</span> <span class="fw-semibold">${esc(cart.user_name ?? '-')}</span></div>
        <div><span class="text-muted small">이메일:</span> <span class="fw-semibold">${esc(cart.user_email ?? '-')}</span></div>
        <div><span class="text-muted small">생성일:</span> <span class="fw-semibold">${fmtDate(cart.created_at)}</span></div>
      </div>
      <div class="card">
        <div class="card-header py-2 small fw-semibold bg-light">담긴 상품 (${items.length}개)</div>
        <div class="card-body p-0">
          <table class="table table-sm align-middle mb-0">
            <thead class="table-light">
              <tr>
                <th style="width:56px">썸네일</th>
                <th>상품명</th><th>SKU</th><th>기본가</th><th>수량</th>
              </tr>
            </thead>
            <tbody>
              ${items.length ? items.map(item => `
                <tr>
                  <td>${item.thumbnail_url
                    ? `<img src="${esc(item.thumbnail_url)}" class="img-thumb-sm">`
                    : `<div class="img-thumb-sm bg-light" style="border-radius:4px;border:1px solid #dee2e6"></div>`}</td>
                  <td class="fw-semibold small">${esc(item.product_name)}</td>
                  <td><code class="small">${esc(item.sku_code ?? '-')}</code></td>
                  <td class="small">${fmtMoney(item.base_price)}</td>
                  <td class="fw-semibold">${item.quantity}</td>
                </tr>`).join('')
              : '<tr><td colspan="5" class="text-center text-muted py-3">담긴 상품 없음</td></tr>'}
            </tbody>
          </table>
        </div>
      </div>`;
  } catch(e) {
    document.getElementById('detailBody').innerHTML = `<div class="alert alert-danger">${esc(e.message)}</div>`;
  }
}

loadCarts();
</script>
{% endblock %}
